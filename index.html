<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>George Albin Seda | Links</title>
<meta name="description" content="Computer Engineering student at TIP Quezon City. Find my Facebook, TikTok, LinkedIn, and portfolio here.">
<meta property="og:title" content="George Albin M. Seda">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500&display=swap">
<style>
  :root {
    --ink: #0E1624;
    --panel: #18233A;
    --panel-hover: #223253;
    --line: #2C3B59;
    --text: #F2F5FA;
    --muted: #A9B6CC;
    --accent: #2DD4BF;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--ink);
    color: var(--text);
    font-family: 'Inter', system-ui, sans-serif;
    display: flex;
    justify-content: center;
    padding: 56px 20px 40px;
  }
  main {
    width: 100%;
    max-width: 480px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }
  .avatar {
    width: 132px;
    height: 132px;
    border-radius: 50%;
    padding: 5px;
    background: var(--accent);
    display: grid;
    place-items: center;
  }
  .avatar img, .avatar .initials {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    object-fit: cover;
    background: var(--panel);
    border: 4px solid var(--ink);
  }
  .avatar .initials {
    display: none;
    place-items: center;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 40px;
    color: var(--accent);
  }
  .handle {
    margin: 22px 0 4px;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 34px;
  }
  .name { margin: 0; font-size: 18px; font-weight: 500; }
  .bio { margin: 8px 0 0; font-size: 15px; color: var(--muted); line-height: 1.5; }
  .links {
    list-style: none;
    padding: 0;
    margin: 36px 0 0;
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .btn {
    display: flex;
    align-items: center;
    gap: 14px;
    min-height: 64px;
    padding: 0 24px;
    border-radius: 999px;
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--text);
    text-decoration: none;
    font-weight: 500;
    font-size: 17px;
    transition: background .15s ease, border-color .15s ease;
  }
  .btn:hover { background: var(--panel-hover); border-color: var(--accent); }
  .btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  .btn svg { flex: none; width: 24px; height: 24px; stroke: var(--accent); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .btn span { flex: 1; text-align: center; padding-right: 24px; }
  footer { margin-top: 40px; font-size: 13px; color: var(--muted); }
  @media (prefers-reduced-motion: reduce) { .btn { transition: none; } }
</style>
</head>
<body>
<main>
  <div class="avatar">
    <!-- Put your photo in the same folder and name it profile.jpg -->
    <img src="profile.jpg" alt="Photo of George Albin Seda" onerror="this.style.display='none';this.nextElementSibling.style.display='grid'">
    <div class="initials" aria-hidden="true">GS</div>
  </div>

  <h1 class="handle">@geoseda</h1>

        <span>Facebook</span>
      </a>
    </li>
    <li>
      <!-- Replace with your TikTok link -->

        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3v12.5a3.5 3.5 0 1 1-3.5-3.5"/><path d="M14 3c.3 2.6 2 4.4 5 4.6"/></svg>
        <span>TikTok</span>
      </a>
    </li>
    <li>
      <a class="btn" href="https://www.linkedin.com/in/george-albin-seda-2122ba3b7/" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M8 10v7M8 7v.01M12 17v-7M12 13a3 3 0 0 1 6 0v4"/></svg>

        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.7 3.8 5.7 3.8 9s-1.3 6.3-3.8 9c-2.5-2.7-3.8-5.7-3.8-9S9.5 5.7 12 3z"/></svg>
        <span>Portfolio</span>
      </a>
    </li>
  </ul>

  <footer>Tap a button to open</footer>
</main>
</body>
</html>
